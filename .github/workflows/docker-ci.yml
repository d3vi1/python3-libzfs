name: Docker Build and Test

on:
  pull_request:
  push:
    branches:
      - zfs-2.2
      - main
  workflow_dispatch:

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_GLOBAL: /tmp/gitconfig
      GIT_CONFIG_SYSTEM: /dev/null
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: ubuntu-focal
            image: ubuntu:20.04
          - name: ubuntu-jammy
            image: ubuntu:22.04
          - name: ubuntu-questing
            image: ubuntu:25.10
          - name: rocky-el8
            image: rockylinux:8
          - name: rocky-el9
            image: rockylinux:9
    name: ${{ matrix.target.name }}
    steps:
      - name: Configure git defaults
        run: |
          printf "[init]\n\tdefaultBranch = main\n" > "${GIT_CONFIG_GLOBAL}"
      - uses: actions/checkout@v4
      - name: Prepare cache directories
        run: |
          mkdir -p .cache/apt .cache/apt-lists .cache/dnf
      - name: Cache package manager data
        uses: actions/cache@v4
        with:
          path: |
            .cache/apt
            .cache/apt-lists
            .cache/dnf
          key: ${{ runner.os }}-${{ matrix.target.name }}-pkg-${{ hashFiles('ci/run_in_container.sh') }}
      - name: Run build/test in container
        run: |
          docker create --name "build-${{ matrix.target.name }}" \
            -v "${{ github.workspace }}:/work" \
            -v "${{ github.workspace }}/.cache/apt:/var/cache/apt" \
            -v "${{ github.workspace }}/.cache/apt-lists:/var/lib/apt/lists" \
            -v "${{ github.workspace }}/.cache/dnf:/var/cache/dnf" \
            -w /work \
            "${{ matrix.target.image }}" \
            bash -lc "sleep infinity"
          docker start "build-${{ matrix.target.name }}"
          docker exec "build-${{ matrix.target.name }}" bash -lc "./ci/run_in_container.sh ${{ matrix.target.name }} setup"
          docker exec "build-${{ matrix.target.name }}" bash -lc "./ci/run_in_container.sh ${{ matrix.target.name }} build"
      - name: Cleanup container
        if: always()
        run: docker rm -f "build-${{ matrix.target.name }}"
      - name: Fix cache permissions
        if: always()
        run: |
          sudo chown -R "$USER:$USER" .cache || true
          sudo chmod -R u+rwX .cache || true
